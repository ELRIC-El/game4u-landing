<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game4U</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --r:#ff2d55;--b:#00c8ff;--g:#39ff14;--p:#bf5fff;
  --bg:#080810;--card:#0e0e1a;--border:rgba(255,255,255,0.07);
}
body{background:var(--bg);color:#fff;font-family:'Inter',sans-serif;overflow-x:hidden;}

/* ═══ ANIMATED BG ═══ */
canvas#bg{position:fixed;inset:0;z-index:-2;}

.glow-orbs{position:fixed;inset:0;z-index:-1;pointer-events:none;}
.orb{position:absolute;border-radius:50%;filter:blur(80px);animation:drift 12s ease-in-out infinite;}
.orb1{width:400px;height:400px;background:rgba(255,45,85,0.12);top:-100px;left:-100px;animation-delay:0s;}
.orb2{width:350px;height:350px;background:rgba(0,200,255,0.1);bottom:-80px;right:-80px;animation-delay:-4s;}
.orb3{width:300px;height:300px;background:rgba(191,95,255,0.09);top:40%;left:50%;animation-delay:-8s;}

@keyframes drift{
  0%,100%{transform:translate(0,0) scale(1);}
  33%{transform:translate(30px,-30px) scale(1.05);}
  66%{transform:translate(-20px,20px) scale(0.95);}
}

/* grid lines */
.gridlines{
  position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:
    linear-gradient(rgba(0,200,255,0.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,200,255,0.03) 1px,transparent 1px);
  background-size:44px 44px;
}

/* ═══ NAV ═══ */
nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;
  background:rgba(8,8,16,0.75);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:100;
}
.logo{
  font-size:22px;font-weight:900;letter-spacing:-0.5px;
  background:linear-gradient(90deg,var(--r),var(--b));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:none;filter:drop-shadow(0 0 12px rgba(255,45,85,0.5));
}
.nav-r{display:flex;align-items:center;gap:10px;}
.search-btn{
  width:34px;height:34px;border-radius:9px;background:#111;
  border:1px solid var(--border);color:#666;font-size:14px;
  cursor:pointer;display:grid;place-items:center;transition:.2s;
}
.search-btn:hover{border-color:var(--b);color:var(--b);box-shadow:0 0 10px rgba(0,200,255,0.25);}

/* ═══ HERO ═══ */
.hero{
  text-align:center;padding:50px 20px 30px;position:relative;
}
.hero h1{
  font-size:clamp(36px,10vw,72px);font-weight:900;
  line-height:.95;letter-spacing:-2px;margin-bottom:12px;
}
.hero h1 .neon-r{
  background:linear-gradient(135deg,#ff2d55,#ff9500);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 20px rgba(255,45,85,0.6));
}
.hero h1 .neon-b{
  background:linear-gradient(135deg,#00c8ff,#bf5fff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 20px rgba(0,200,255,0.6));
}
.hero p{font-size:13px;color:#444;letter-spacing:1px;text-transform:uppercase;}

/* ═══ SEARCH ═══ */
.search-wrap{
  padding:0 16px 16px;display:none;
}
.search-wrap.show{display:block;}
.search-wrap input{
  width:100%;padding:12px 16px;
  background:#111;border:1px solid #222;border-radius:10px;
  color:#fff;font-family:'Inter',sans-serif;font-size:14px;outline:none;
  transition:.2s;
}
.search-wrap input:focus{border-color:var(--b);box-shadow:0 0 0 2px rgba(0,200,255,0.1);}
.search-wrap input::placeholder{color:#333;}

/* ═══ FILTERS ═══ */
.filters{
  display:flex;gap:6px;padding:0 16px 18px;
  overflow-x:auto;scrollbar-width:none;
}
.filters::-webkit-scrollbar{display:none;}
.f{
  padding:6px 15px;border-radius:7px;border:1px solid #1e1e1e;
  background:transparent;color:#444;
  font-family:'Inter',sans-serif;font-size:11px;font-weight:600;
  cursor:pointer;white-space:nowrap;transition:.2s;
  text-transform:uppercase;letter-spacing:.5px;
}
.f:hover{color:#fff;border-color:#333;}
.f.on{
  background:var(--r);border-color:var(--r);color:#fff;
  box-shadow:0 0 16px rgba(255,45,85,0.4);
}

/* ═══ SECTION LABEL ═══ */
.sec{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px 12px;
}
.sec h2{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:#2a2a2a;}
.sec span{font-size:10px;color:#222;background:#111;
  border:1px solid #1a1a1a;padding:2px 9px;border-radius:20px;}

/* ═══ GRID ═══ */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:1px;background:#111;
  border-top:1px solid #111;
}

/* ═══ CARD ═══ */
.card{
  background:var(--bg);cursor:pointer;
  transition:background .15s;
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;
}
.card:hover{background:#0d0d18;}
.card:active{background:#121220;}

/* neon border flash on hover */
.card::before{
  content:'';position:absolute;inset:0;
  border:1px solid transparent;
  transition:.3s;pointer-events:none;z-index:1;
}
.card:hover::before{border-color:rgba(0,200,255,0.2);}

.card-img{
  width:100%;aspect-ratio:1/1;object-fit:cover;
  display:block;transition:transform .3s;
}
.card:hover .card-img{transform:scale(1.05);}

.img-wrap{overflow:hidden;position:relative;}

/* neon genre tag on image */
.genre-tag{
  position:absolute;bottom:5px;left:5px;z-index:2;
  font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
  padding:2px 6px;border-radius:4px;
  background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);
  border:1px solid rgba(255,255,255,0.1);color:#aaa;
}

.card-body{padding:8px 8px 10px;flex:1;}
.card-body h3{
  font-size:11px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-bottom:2px;
}
.card-body .sub{font-size:9px;color:#333;margin-bottom:6px;}
.card-footer{display:flex;align-items:center;justify-content:space-between;}
.star{font-size:9px;color:#f59e0b;}
.get-pill{
  font-size:8px;font-weight:700;text-transform:uppercase;
  background:rgba(255,45,85,0.12);
  border:1px solid rgba(255,45,85,0.3);
  color:var(--r);padding:2px 8px;border-radius:20px;
  transition:.2s;
}
.card:hover .get-pill{
  background:var(--r);color:#fff;
  box-shadow:0 0 10px rgba(255,45,85,0.4);
}

/* ═══ EMPTY ═══ */
.empty{
  text-align:center;padding:60px;color:#222;
  grid-column:1/-1;font-size:13px;
}

/* ═══ OVERLAY / SHEET ═══ */
.ov{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.8);
  backdrop-filter:blur(12px);
  z-index:200;display:flex;
  align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.ov.open{opacity:1;pointer-events:all;}

.sheet{
  background:#0e0e18;
  width:100%;max-width:480px;
  border-radius:22px 22px 0 0;
  border:1px solid #1a1a2a;border-bottom:none;
  transform:translateY(100%);
  transition:transform .35s cubic-bezier(.4,0,.2,1);
  max-height:90vh;overflow-y:auto;scrollbar-width:none;
}
.sheet::-webkit-scrollbar{display:none;}
.ov.open .sheet{transform:translateY(0);}

.handle{width:32px;height:3px;background:#1e1e2e;border-radius:2px;margin:12px auto;}

.sh-hero{width:100%;height:170px;object-fit:cover;display:block;}

/* neon line under hero */
.neon-line{
  height:1px;
  background:linear-gradient(90deg,transparent,var(--r),var(--b),var(--p),transparent);
  opacity:.6;
}

.sh-body{padding:18px;}

.sh-top{display:flex;gap:12px;align-items:center;margin-bottom:14px;}
.sh-ico{
  width:58px;height:58px;border-radius:13px;object-fit:cover;flex-shrink:0;
  box-shadow:0 0 20px rgba(255,45,85,0.2);
}
.sh-info h2{font-size:18px;font-weight:800;margin-bottom:3px;}
.sh-meta{display:flex;gap:6px;flex-wrap:wrap;}
.meta{
  font-size:10px;color:#444;background:#111;
  border:1px solid #1a1a1a;padding:2px 8px;border-radius:20px;
}
.meta.r{color:#f59e0b;}

.sh-desc{font-size:12px;color:#555;line-height:1.7;margin-bottom:16px;}

.feat-title{font-size:9px;text-transform:uppercase;letter-spacing:2px;color:#222;margin-bottom:8px;}
.feats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:20px;}
.feat{
  background:#111;border:1px solid #1a1a1a;border-radius:8px;
  padding:7px 10px;font-size:10px;color:#555;
  display:flex;align-items:center;gap:5px;
}
.feat::before{
  content:'';width:4px;height:4px;border-radius:50%;
  background:var(--r);flex-shrink:0;
  box-shadow:0 0 6px var(--r);
}

/* DL BTN */
.dl-btn{
  width:100%;padding:14px;border:none;border-radius:12px;
  background:linear-gradient(135deg,var(--r),#ff6b00);
  color:#fff;font-family:'Inter',sans-serif;
  font-size:15px;font-weight:800;cursor:pointer;
  letter-spacing:.5px;margin-bottom:8px;
  box-shadow:0 4px 24px rgba(255,45,85,0.35);
  transition:.25s;position:relative;overflow:hidden;
}
.dl-btn::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.12),transparent);
  transform:translateX(-100%);transition:.6s;
}
.dl-btn:hover::after{transform:translateX(100%);}
.dl-btn:hover{box-shadow:0 6px 32px rgba(255,45,85,0.5);}

.cl-btn{
  width:100%;padding:11px;border:1px solid #1a1a1a;border-radius:12px;
  background:transparent;color:#333;font-family:'Inter',sans-serif;
  font-size:13px;cursor:pointer;transition:.2s;
}
.cl-btn:hover{color:#fff;border-color:#333;}

/* pb */
.pb{padding-bottom:40px;}
</style>
</head>

</div>

<div class="hero">

</div>

<!-- FILTERS -->

  <button class="f" onclick="fc('strategy',this)">Strategy</button>
  <button class="f" onclick="fc('casual',this)">Casual</button>
</div>

<div style="padding:0 16px 40px;">
  <div class="sec">
    <h2>All Games</h2>
    <span id="cnt">30 games</span>
  </div>
  <div class="grid" id="grid"></div>
  <div class="pb"></div>
</div>

<!-- SHEET -->
<div class="ov" id="ov" onclick="maybeClose(event)">
  <div class="sheet" id="sheet">
    <div class="handle"></div>
    <img class="sh-hero" id="sHero" src="" alt="">
    <div class="neon-line"></div>
    <div class="sh-body">
      <div class="sh-top">
        <img class="sh-ico" id="sIco" src="" alt="">
        <div class="sh-info">

          <div class="sh-meta">
            <span class="meta" id="sGenre"></span>
            <span class="meta r" id="sRating"></span>
            <span class="meta" id="sDl"></span>
          </div>
        </div>
      </div>
      <p class="sh-desc" id="sDesc"></p>
      <div class="feat-title">Features</div>
      <div class="feats" id="sFeats"></div>
      <button class="dl-btn" id="dlBtn">⬇ Download Free</button>
      <button class="cl-btn" onclick="closeSheet()">Close</button>
    </div>
  </div>
</div>

/* ══ PARTICLE BG ══ */
const canvas=document.getElementById('bg');
const ctx=canvas.getContext('2d');
let W,H,pts=[];
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;init();}
function init(){
  pts=[];
  const n=Math.floor((W*H)/14000);
  for(let i=0;i<n;i++)pts.push({
    x:Math.random()*W,y:Math.random()*H,
    vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,
    r:Math.random()*1.2+.3,
    c:['rgba(255,45,85','rgba(0,200,255','rgba(191,95,255'][Math.floor(Math.random()*3)]
  });
}
function draw(){
  ctx.clearRect(0,0,W,H);
  pts.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<0)p.x=W;if(p.x>W)p.x=0;
    if(p.y<0)p.y=H;if(p.y>H)p.y=0;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=p.c+',0.6)';ctx.fill();
  });
  pts.forEach((a,i)=>pts.slice(i+1).forEach(b=>{
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    if(d<90){
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
      ctx.strokeStyle=`rgba(0,200,255,${(1-d/90)*.04})`;
      ctx.lineWidth=.5;ctx.stroke();
    }
  }));
  requestAnimationFrame(draw);
}
window.addEventListener('resize',resize);
resize();draw();

let cat='all', active=null;

function render(){
  const q=document.getElementById('q').value.toLowerCase();
  const list=G.filter(g=>
    (cat==='all'||g.cat===cat)&&
    (g.name.toLowerCase().includes(q)||g.genre.toLowerCase().includes(q))
  );
  document.getElementById('cnt').textContent=list.length+' game'+(list.length!==1?'s':'');
  const grid=document.getElementById('grid');
  if(!list.length){
    grid.innerHTML=`<div class="empty">No results for "${q}"</div>`;return;
  }
  grid.innerHTML=list.map((g,i)=>`
    <div class="card" style="animation:fadeUp .4s ${i*.03}s both" onclick="openSheet(${g.id})">
      <div class="img-wrap">
        <img class="card-img" src="${g.icon}" alt="${g.name}"
          onerror="this.src='https://picsum.photos/seed/${g.id}/200/200'">
        <span class="genre-tag">${g.genre}</span>
      </div>
      <div class="card-body">
        <h3>${g.name}</h3>
        <div class="sub">${g.dl} downloads</div>
        <div class="card-footer">
          <span class="star">★ ${g.r}</span>
          <span class="get-pill">Get</span>
        </div>
      </div>
    </div>`).join('');
}

function fc(c,btn){
  cat=c;
  document.querySelectorAll('.f').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');render();
}

function toggleSearch(){
  const sw=document.getElementById('sw');
  sw.classList.toggle('show');
  if(sw.classList.contains('show'))document.getElementById('q').focus();
  else{document.getElementById('q').value='';render();}
}

function openSheet(id){
  const g=G.find(x=>x.id===id);active=g;
  document.getElementById('sHero').src=g.hero;
  document.getElementById('sHero').onerror=function(){this.src=g.icon;};
  document.getElementById('sIco').src=g.icon;
  document.getElementById('sTitle').textContent=g.name;
  document.getElementById('sGenre').textContent=g.genre;
  document.getElementById('sRating').textContent='★ '+g.r;
  document.getElementById('sDl').textContent=g.dl+' downloads';
  document.getElementById('sDesc').textContent=g.desc;
  document.getElementById('sFeats').innerHTML=g.f.map(f=>
    `<div class="feat">${f}</div>`).join('');
  document.getElementById('ov').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeSheet(){
  document.getElementById('ov').classList.remove('open');
  document.body.style.overflow='';
}

function maybeClose(e){
  if(e.target===document.getElementById('ov'))closeSheet();
}

document.getElementById('dlBtn').onclick=()=>{
  if(active)window.open(active.url,'_blank');
};

/* card fadeUp keyframe */
const st=document.createElement('style');
st.textContent='@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}';
document.head.appendChild(st);

render();
</script>
